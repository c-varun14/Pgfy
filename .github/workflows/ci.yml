name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir web build
      - run: go vet ./... && go test -race ./...
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: bash -n deploy/bootstrap.sh deploy/install.sh deploy/pgfyctl deploy/postgres/*.sh
      - run: go build -o bin/pgfy ./cmd/pgfy
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - run: python3 scripts/build-image.py
      - run: python3 scripts/integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-test-evidence
          include-hidden-files: true
          path: |
            web/test-results/
            .cache/integration-results.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable application image
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/build-image.py --tag "ghcr.io/c-varun14/pgfy:$RELEASE_VERSION" --version "$RELEASE_VERSION"
          PGFY_TEST_IMAGE="ghcr.io/c-varun14/pgfy:$RELEASE_VERSION" python3 scripts/integration.py
          docker push "ghcr.io/c-varun14/pgfy:$RELEASE_VERSION"
          docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/c-varun14/pgfy:$RELEASE_VERSION" > /tmp/pgfy-image-reference
      - name: Verify anonymous installation access
        run: |
          docker logout ghcr.io
          docker pull "$(cat /tmp/pgfy-image-reference)"
      - name: Assemble release bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/bundle.py --version "$RELEASE_VERSION" --image "$(cat /tmp/pgfy-image-reference)"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/bootstrap.sh dist/*.tar.gz dist/*.sha256 --verify-tag --notes-file docs/release-notes.md "${release_args[@]}"
      - name: Verify public release downloads
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/check-release.py --version "$RELEASE_VERSION"
